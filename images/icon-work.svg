<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Tab icon for an activity/project sheet: the same lure, lowered on
       its sounding line to the depth the sheet's own kicker announces.
       Open a few sheets at once and the tab strip reads as a depth
       profile. The colors are the lure and mist tokens from theme.css,
       written out because a favicon cannot inherit them. -->
  <line x1="8" y1="0" x2="8" y2="5.4" stroke="#9DB4B5" stroke-width="1"/>
  <g transform="translate(3.52 5) scale(0.64)">
    <path fill="#D7F24B" d="M7 0.5C8.6 3.4 10.8 6.2 10.8 9.2A3.8 3.8 0 0 1 3.2 9.2C3.2 6.2 5.4 3.4 7 0.5Z"/>
  </g>
</svg>
